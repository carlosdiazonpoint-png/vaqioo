{% extends "base.html" %}
{% block title %}Mi billetera{% endblock %}
{% block content %}
<div class="app-shell">

  <header class="app-header">
    <div class="brand"><span class="brand-dot"></span>Vaqui</div>
    <div class="header-right">
      <span class="hello">Hola, {{ user.full_name.split(' ')[0] }}</span>
      <a href="{{ url_for('auth.logout') }}" class="icon-btn" title="Cerrar sesión">⏻</a>
    </div>
  </header>

  <main class="app-main">

    <section class="balance-card">
      <span class="balance-label">Saldo disponible</span>
      <div class="balance-row">
        <span class="balance-amount" id="balanceAmount">$0</span>
        <button class="eye-btn" id="toggleBalance" title="Mostrar/ocultar saldo">👁</button>
      </div>
      <span class="phone-tag">📱 {{ user.phone }}</span>
    </section>

    <section class="actions-row">
      <button class="action-btn" id="openDeposit">
        <span class="action-icon">＋</span>Recargar
      </button>
      <button class="action-btn" id="openTransfer">
        <span class="action-icon">➤</span>Transferir
      </button>
    </section>

    <section class="history-section">
      <h3>Movimientos recientes</h3>
      <ul class="history-list" id="historyList">
        <li class="history-empty">Cargando...</li>
      </ul>
    </section>

  </main>
</div>

<!-- Modal Recargar -->
<div class="modal-overlay" id="depositModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Recargar saldo</h3>
      <button class="close-btn" data-close="depositModal">✕</button>
    </div>
    <form id="depositForm">
      <label>Monto a recargar</label>
      <input type="number" id="depositAmount" min="1000" step="1000" placeholder="50000" required>
      <div class="quick-amounts">
        <button type="button" class="chip" data-amount="20000">$20.000</button>
        <button type="button" class="chip" data-amount="50000">$50.000</button>
        <button type="button" class="chip" data-amount="100000">$100.000</button>
      </div>
      <p class="form-error" id="depositError"></p>
      <button type="submit" class="btn btn-primary btn-block">Confirmar recarga</button>
    </form>
  </div>
</div>

<!-- Modal Transferir -->
<div class="modal-overlay" id="transferModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Transferir</h3>
      <button class="close-btn" data-close="transferModal">✕</button>
    </div>
    <form id="transferForm">
      <label>Celular del destinatario</label>
      <input type="text" id="transferPhone" placeholder="3001234567" required>

      <label>Monto</label>
      <input type="number" id="transferAmount" min="1000" step="1000" placeholder="10000" required>

      <label>Descripción (opcional)</label>
      <input type="text" id="transferDesc" placeholder="Ej: pago almuerzo">

      <label>PIN de seguridad</label>
      <input type="password" id="transferPin" maxlength="4" pattern="\d{4}" placeholder="••••" required inputmode="numeric">

      <p class="form-error" id="transferError"></p>
      <button type="submit" class="btn btn-primary btn-block">Enviar plata</button>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
