{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <form class="auth-card" method="POST">
    <div class="brand"><span class="brand-dot"></span>Vaqui</div>
    <h2>Crea tu cuenta</h2>

    <label>Nombre completo</label>
    <input type="text" name="full_name" required autofocus placeholder="Juan Pérez">

    <label>Celular</label>
    <input type="text" name="phone" required placeholder="3001234567">

    <label>Correo</label>
    <input type="email" name="email" required placeholder="tu@correo.com">

    <label>Contraseña</label>
    <input type="password" name="password" required placeholder="Mínimo 6 caracteres">

    <label>PIN de 4 dígitos (para transferencias)</label>
    <input type="password" name="pin" required maxlength="4" pattern="\d{4}" placeholder="••••" inputmode="numeric">

    <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>

    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
  </form>
</div>
{% endblock %}
